name: Build Cyber AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Android project
        run: flutter create --platforms=android --org com.example --project-name cyber_ai .
      - name: Restore Android configuration
        run: git checkout -- android/app/src/main/AndroidManifest.xml android/app/src/main/kotlin/com/example/cyber_ai/MainActivity.kt
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
